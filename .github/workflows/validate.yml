name: Plugin Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install PyYAML
        # validate.py's frontmatter guard mirrors the skills publish's yaml.safe_load
        # (catches the frontmatter-drop class the publish would reject). pyyaml is a
        # declared garden dependency; install it explicitly, as test.yml installs pytest.
        run: pip install pyyaml

      - name: Run structural validation
        run: python scripts/ci/validate.py

      - name: Validate in-code allowlists (registry validator)
        run: python scripts/_validate_registry.py
