[project]
name = "wicked-garden"
# NOT a release anchor. The plugin's version lives in package.json and is synced into
# .claude-plugin/{plugin,marketplace}.json by `npm version` -> .github/scripts/sync-plugin-version.mjs
# when the vX.Y.Z tag runs release.yml. This Python project is never built or published (the hatch
# target exists only so uv can manage deps), nothing reads this field, and the release train does
# not bump it — PEP 621 requires a value, so it is pinned to the placeholder 0.0.0 (mirrored in uv.lock).
version = "0.0.0"
description = "AI-Native SDLC delivered as a single Claude Code plugin"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
    "aiofiles>=23.0",
    "pydantic>=2.0",
    "pathspec>=0.11.0",
    "pyyaml>=6.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Not a distributable package — this pyproject.toml exists so uv can manage deps
packages = ["scripts"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
]
# uv resolves from repo root so all `cd $PLUGIN_ROOT && uv run python ...` invocations work

# Hypothesis config (design-addendum-1 D-8):
#   derandomize=true keeps PR CI deterministic per T1 (determinism).
#   Nightly 10K-iter jobs can override with --hypothesis-seed=random.
[tool.hypothesis]
database_file = ".hypothesis/examples"
deadline = 1000
verbosity = "normal"
derandomize = true

# pytest config — marker registration keeps the benchmark lane opt-in.
# Running `pytest` without `-m benchmark` excludes the benchmark suite via
# the addopts default; CI opts in explicitly in .github/workflows/benchmark.yml.
[tool.pytest.ini_options]
testpaths = ["tests", "daemon"]
markers = [
    "benchmark: AC-11 gate-result ingestion perf SLO lane (opt-in via `-m benchmark`). See .github/workflows/benchmark.yml.",
    "slow: integration tests that invoke real subprocesses and take >1s (excluded from fast-CI runs with `-m 'not slow'`).",
]
addopts = "-m 'not benchmark'"
