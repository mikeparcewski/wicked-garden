# qe campaign — PR lane: the DETERMINISTIC subset (TH-23 / test-R19b).
#
# RECIPE, not turnkey: copy into the TARGET repo's .github/workflows/ and edit
# the <angle-bracket> placeholders. Full doctrine: wicked-garden
# skills/qe/refs/campaign-ci.md.
#
# What this lane is: committed runner specs (scripts/qe/runner — model-free by
# construction) and Tool-phase campaign scenarios, executed against an ISOLATED
# instance the job boots itself. Zero LLM calls, zero seats, zero tokens.
#
# What this lane is NOT: graded. The job's verdict is the EXECUTOR CLAIM (exit
# codes fail the PR). Never write reviewer verdicts rows from here (TH-10), and
# never run the rerun diff here — diffs compare GRADED verdicts (nightly lane).

name: qe-campaign-pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qe-campaign-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # TH-8 posture: the job boots its own target on an ephemeral 79xx port
      # with scratch state dirs — never a shared/staging instance.
      QE_TARGET_PORT: "7941"
      WICKED_QE_LEDGER_DIR: ${{ github.workspace }}/.wicked-qe
      CAMPAIGN_DIR: .wicked-qe/campaigns/<name> # <EDIT>: the committed campaign dir
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The model-free executor runtime (vendored playwright + wicked-ledger).
      - name: Install qe runner
        run: |
          cd scripts/qe/runner
          npm ci
          npx playwright install --with-deps chromium

      # <EDIT>: build + boot the TARGET here, isolated. Example (wicked-crew):
      #   npm ci && npm run build
      #   node packages/crew/dist/cli/index.js serve --port "$QE_TARGET_PORT" \
      #     --db "$RUNNER_TEMP/core.db" --bus-db "$RUNNER_TEMP/bus.db" &
      #   until curl -sf "http://127.0.0.1:$QE_TARGET_PORT/api/v1/health"; do sleep 1; done
      - name: Boot isolated target
        run: 'echo "<EDIT: boot the target on port $QE_TARGET_PORT with scratch state>"'

      # Lint first (exit 4 = spec rejected), then execute. A spec's non-zero
      # exit fails the PR — that IS the deterministic tripwire.
      - name: Run the deterministic subset
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=("$CAMPAIGN_DIR"/specs/*.spec.json)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "no committed specs found — the subset must never be silently empty" >&2
            exit 1
          fi
          for spec in "${specs[@]}"; do
            node scripts/qe/runner/bin/qe-run.mjs "$spec" --lint-only
            node scripts/qe/runner/bin/qe-run.mjs "$spec"
          done

      # Evidence ALWAYS uploads — a failed run without its bundle is a claim,
      # not a finding. Redaction (TH-19) already ran inside the runner.
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-evidence-pr-${{ github.event.pull_request.number }}
          path: .wicked-qe/evidence/
          if-no-files-found: warn
          retention-days: 14
